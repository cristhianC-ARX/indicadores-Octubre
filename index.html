            color: #ff6b35;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(255, 107, 53, 0.1);
            margin-bottom: 30px;
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filters label {
            font-weight: 600;
            color: #333;
        }

        .filters input {
            padding: 10px;
            border: 2px solid #ff6b35;
            border-radius: 6px;
            font-size: 14px;
        }

        .filters button {
            padding: 10px 25px;
            background: #ff6b35;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.3s;
        }

        .filters button:hover {
            background: #e55a2b;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(255, 107, 53, 0.1);
            border-left: 5px solid #ff6b35;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(255, 107, 53, 0.2);
        }

        .stat-card h3 {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .stat-card .number {
            font-size: 3em;
            font-weight: bold;
            color: #ff6b35;
        }

        .departments-section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(255, 107, 53, 0.1);
            margin-bottom: 30px;
        }

        .departments-section h2 {
            color: #ff6b35;
            margin-bottom: 20px;
            font-size: 1.8em;
        }

        .department-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: #fff5f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            border-left: 4px solid #ff6b35;
        }

        .department-item:hover {
            background: #ffe5d9;
            transform: translateX(5px);
        }

        .department-name {
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }

        .department-count {
            background: #ff6b35;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 12px;
            max-width: 900px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 3px solid #ff6b35;
        }

            color: #ff6b35;
        }

        .close-btn {
            background: #ff6b35;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            font-weight: bold;
        }

        .close-btn:hover {
            background: #e55a2b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #ff6b35;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ffe5d9;
        }

        tr:hover {
            background: #fff5f0;
        }

        .status-badge {
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .status-espera {
            background: #fff3cd;
            color: #856404;
        }

        .status-ejecucion {
            background: #cfe2ff;
            color: #084298;

            background: #d1e7dd;
            color: #0f5132;

            color: #842029;

        .summary-stats {

            margin-bottom: 20px;

            text-transform: uppercase;

            font-size: 24px;
            font-weight: bold;
            color: #ff6b35;

    </style>

        function inicializarFechas() {
            const hoy = new Date();
            const primerDia = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
            
            document.getElementById('fechaDesde').value = primerDia.toISOString().split('T')[0];
            document.getElementById('fechaHasta').value = hoy.toISOString().split('T')[0];
            
            filtrarPorFecha();
        }

        function renderizarDashboard() {
            const stats = {
                'Total': 0,
                'En espera': 0,
                'EN EJECUCIÓN': 0,
                'FINALIZADO': 0,
                'Cancelada': 0
            };

            ticketsFiltrados.forEach(ticket => {
                stats['Total']++;
                stats[ticket.etapa]++;
            });

            const statsGrid = document.getElementById('statsGrid');
            const totalCard = `
                <div class="stat-card" style="border-left: 5px solid #333;">
                    <h3>Total de Tickets</h3>
                    <div class="number" style="color: #333;">${stats.Total}</div>
                </div>
            `;
            const esperaCard = `
                <div class="stat-card">
                    <h3>En Espera</h3>
                    <div class="number">${stats['En espera']}</div>
                </div>
            `;
            const ejecucionCard = `
                <div class="stat-card">
                    <h3>En Ejecución</h3>
                    <div class="number">${stats['EN EJECUCIÓN']}</div>
                </div>
            `;
            const finalizadosCard = `
                <div class="stat-card">
                    <h3>Finalizados</h3>
                    <div class="number">${stats['FINALIZADO']}</div>
                </div>
            `;
            const canceladosCard = `
                <div class="stat-card">
                    <h3>Cancelados</h3>
                    <div class="number">${stats['Cancelada']}</div>
                </div>
            `;
            
            statsGrid.innerHTML = totalCard + esperaCard + ejecucionCard + finalizadosCard + canceladosCard;

            renderizarDepartamentos();
        }

        function renderizarDepartamentos() {
            const departamentos = {};
            
            ticketsFiltrados.forEach(ticket => {
                if (!departamentos[ticket.departamento]) {
                    departamentos[ticket.departamento] = [];
                }
                departamentos[ticket.departamento].push(ticket);
            });

            const departamentosArray = Object.keys(departamentos).map(dept => ({
                nombre: dept,
                cantidad: departamentos[dept].length,
                tickets: departamentos[dept]
            }));

            departamentosArray.sort((a, b) => b.cantidad - a.cantidad);

            const departmentsList = document.getElementById('departmentsList');
            departmentsList.innerHTML = '';
            
            departamentosArray.forEach(dept => {
                const deptDiv = document.createElement('div');
                deptDiv.className = 'department-item';
                deptDiv.innerHTML = `
                    <span class="department-name">${dept.nombre}</span>
                    <span class="department-count">${dept.cantidad}</span>
                `;
                deptDiv.addEventListener('click', () => mostrarDetalleDepartamento(dept));
                departmentsList.appendChild(deptDiv);
            });
        }

        function mostrarDetalleDepartamento(dept) {
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modalTitle');
            const modalTableBody = document.getElementById('modalTableBody');
            const summaryStats = document.getElementById('summaryStats');

            modalTitle.textContent = `Departamento: ${dept.nombre}`;

            const estadisticas = {
                'En espera': 0,
                'EN EJECUCIÓN': 0,
                'FINALIZADO': 0,
                'Cancelada': 0
            };

            dept.tickets.forEach(ticket => {
                estadisticas[ticket.etapa]++;
            });

            summaryStats.innerHTML = `
                <div class="summary-stat">
                    <div class="label">En Espera</div>
                    <div class="value">${estadisticas['En espera']}</div>
                </div>
                <div class="summary-stat">
                    <div class="label">En Ejecución</div>
                    <div class="value">${estadisticas['EN EJECUCIÓN']}</div>
                </div>
                <div class="summary-stat">
                    <div class="label">Finalizados</div>
                    <div class="value">${estadisticas['FINALIZADO']}</div>
                </div>
                <div class="summary-stat">
                    <div class="label">Cancelados</div>
                    <div class="value">${estadisticas['Cancelada']}</div>
                </div>
            `;

            modalTableBody.innerHTML = dept.tickets.map(ticket => {
                let statusClass = '';
                if (ticket.etapa === 'En espera') statusClass = 'status-espera';
                else if (ticket.etapa === 'EN EJECUCIÓN') statusClass = 'status-ejecucion';
                else if (ticket.etapa === 'FINALIZADO') statusClass = 'status-finalizado';
                else if (ticket.etapa === 'Cancelada') statusClass = 'status-cancelada';

                return `
                    <tr>
                        <td>${ticket.asunto}</td>
                        <td>${ticket.cliente}</td>
                        <td>${ticket.asignado}</td>
                        <td>${ticket.fecha}</td>
                        <td><span class="status-badge ${statusClass}">${ticket.etapa}</span></td>
                    </tr>
                `;
            }).join('');

            modal.classList.add('active');
        }

        function cerrarModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function filtrarPorFecha() {
            const fechaDesde = document.getElementById('fechaDesde').value;
            const fechaHasta = document.getElementById('fechaHasta').value;

            if (!fechaDesde || !fechaHasta) {
                alert('Por favor selecciona ambas fechas');
                return;
            }

            ticketsFiltrados = ticketsData.filter(ticket => {
                return ticket.fecha >= fechaDesde && ticket.fecha <= fechaHasta;
            });

            renderizarDashboard();
        }

        function resetearFiltros() {
            inicializarFechas();
        }

        // Event Listeners
        document.getElementById('btnFiltrar').addEventListener('click', filtrarPorFecha);
        document.getElementById('btnResetear').addEventListener('click', resetearFiltros);
        document.getElementById('btnCerrar').addEventListener('click', cerrarModal);

        // Inicializar al cargar
        window.addEventListener('DOMContentLoaded', inicializarFechas);
    </script>
</body>
</html>
